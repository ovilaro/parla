name: Rescue macOS signing

# Re-sign, notarize and publish a release whose macos-sign job failed,
# reusing the build artifacts of the original CI run. This avoids
# rebuilding or moving the release tag: trigger it manually with the
# run id of the failed CI run and the tag to publish.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run id to take the build artifacts from"
        required: true
      tag:
        description: "Existing release tag to publish (e.g. 0.7.4)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  sign-and-release:
    runs-on: macos-latest
    environment: release
    steps:
      - name: Install dependencies
        run: brew install create-dmg

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts from the failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --dir artifacts

      - name: Install Apple Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: "keychainpass-${{ github.run_id }}"
        run: ./scripts/macos/ci-keychain.sh

      - name: Sign and package the App Bundle
        run: ./scripts/macos/ci-sign.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/macos/ci-notarize.sh

      - uses: actions/upload-artifact@v7
        with:
          name: parla-macos-signed
          path: ./*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # macOS ships bash 3.2, which has no globstar: use find instead of **
          shopt -s nullglob
          debs=( $(find artifacts -type f -name '*.deb') )
          flatpaks=( $(find artifacts -type f -name '*.flatpak') )
          appimages=( $(find artifacts -type f -name '*.AppImage') )
          dmgs=(./*.dmg)
          zips=( $(find artifacts -type f -name '*.zip' -path '*/parla-windows-*') )
          if (( ${#debs[@]} == 0 || ${#flatpaks[@]} == 0 || ${#appimages[@]} == 0 || ${#dmgs[@]} != 3 || ${#zips[@]} == 0 )); then
            find artifacts -maxdepth 4 -type f
            echo "::error::Missing release artifact (.deb, .flatpak, three .dmg files, .AppImage, or .zip)"
            exit 1
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes ""
          fi
          gh release upload "${TAG}" --clobber \
            "${debs[@]}" "${flatpaks[@]}" "${appimages[@]}" "${dmgs[@]}" "${zips[@]}"

      - name: Remove keychain
        if: always()
        run: security delete-keychain release.keychain
