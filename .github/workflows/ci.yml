name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev

      - name: Setup
        run: meson setup builddir

      - name: Build
        run: meson compile -C builddir

  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            make \
            dpkg-dev

      - name: Build
        run: make

      - name: Package .deb
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-deb
          path: dist/debian/parla/*.deb

  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          arch: ${{ matrix.arch }}
          manifest-path: dist/flatpak/io.github.trufae.Parla.json
          bundle: parla-${{ matrix.arch }}.flatpak
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('dist/flatpak/io.github.trufae.Parla.json') }}

  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            make \
            curl \
            python3

      - name: Package AppImage
        run: make appimage ARCH=${{ matrix.arch }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-appimage-${{ matrix.arch }}
          path: dist/appimage/out/*.AppImage
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install \
            meson \
            ninja \
            vala \
            pkgconf \
            gtk4 \
            libadwaita \
            json-glib \
            librsvg \
            webp-pixbuf-loader \
            glib-networking \
            adwaita-icon-theme \
            create-dmg

      - name: Build
        run: make BUILDTYPE=release

      - name: Package DMG
        id: dmg
        run: |
          version=$(awk -F"'" '/version:/ { print $2; exit }' meson.build)
          ARCH="${{ matrix.arch }}" VERSION="$version" scripts/macos/package-dmg.sh | tee /tmp/parla-dmg.log
          dmg=$(tail -n 1 /tmp/parla-dmg.log)
          test -f "$dmg"
          case "$dmg" in
            "$PWD"/*) dmg="${dmg#"$PWD"/}" ;;
          esac
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-macos-${{ matrix.runner }}-${{ matrix.arch }}-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Keep LF endings or bash scripts break inside MSYS2.
      - name: Configure git line endings
        run: git config --global core.autocrlf input
        shell: bash

      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-webp-pixbuf-loader
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build and bundle
        run: bash scripts/windows/bundle.sh

      - name: Run tests
        run: meson test -C builddir-windows --print-errorlogs

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-windows-x86_64
          path: dist/windows/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-deb, build-flatpak, build-appimage, build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          shopt -s nullglob globstar
          debs=(artifacts/**/*.deb)
          flatpaks=(artifacts/**/*.flatpak)
          appimages=(artifacts/**/*.AppImage)
          dmgs=(artifacts/**/*.dmg)
          zips=(artifacts/**/*.zip)
          if (( ${#debs[@]} == 0 || ${#flatpaks[@]} == 0 || ${#appimages[@]} == 0 || ${#dmgs[@]} == 0 || ${#zips[@]} == 0 )); then
            find artifacts -maxdepth 4 -type f
            echo "::error::Missing release artifact (.deb, .flatpak, .AppImage, .dmg, or .zip)"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.flatpak
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.zip
